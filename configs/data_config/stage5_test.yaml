
datasets:
  # Stage 5 test config: quickly verify training script
  # Use small data to test comparative scoring logic
  
  # 1. Social-IQ (test, 8 samples - for 4-GPU training)
  - json_path: data_config/social_iq_v2_rewrite.json
    data_root: ${PROJECT_ROOT}/data/IntentTrain/videos
    sampling_strategy: random:8
    weight: 0.5
  
  # 2. EMER (test, 8 samples - for 4-GPU training)
  - json_path: data_config/emer_rewrite.json
    data_root: ${PROJECT_ROOT}/data/IntentTrain/videos
    sampling_strategy: random:8
    weight: 0.5
