
datasets:
  # Stage 4: People-focus enhanced training
  # Data composition: 90% people-centric + 10% general (prevent forgetting)
  
  # 1. Social-IQ (social interaction understanding, 70%)
  - json_path: data_config/social_iq_v2_rewrite.json
    data_root: ${PROJECT_ROOT}/data/IntentTrain/videos
    sampling_strategy: end:70%
  
  # 2. EMER (emotion recognition, 30%)
  - json_path: data_config/emer_rewrite.json
    data_root: ${PROJECT_ROOT}/data/IntentTrain/videos
    sampling_strategy: all