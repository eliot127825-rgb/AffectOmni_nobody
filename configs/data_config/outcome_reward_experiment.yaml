
datasets:
  # Stage 5 experiment: outcome reward optimization
  # Data composition: Social-IQ last 50% + EMER last 50%
  
  # 1. Social-IQ last 50% (social interaction understanding)
  - json_path: data_config/social_iq_v2_rewrite.json
    data_root: ${PROJECT_ROOT}/data/IntentTrain/videos
    sampling_strategy: end:50%  # last 50%, ~1368 samples
    weight: 0.8
  
  # 2. EMER last 50% (emotion recognition)
  - json_path: data_config/emer_rewrite.json
    data_root: ${PROJECT_ROOT}/data/IntentTrain/videos
    sampling_strategy: end:50%  # last 50%, ~75 samples
    weight: 0.2
